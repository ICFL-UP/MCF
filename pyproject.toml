[project]
name = "mcf-poc"
version = "0.1.0"
# Minimum required: 3.11 (type-hint syntax, match, tomllib).
# Tested on: 3.14.5 (the .venv interpreter as of 2026-07-09).
# If you install with a 3.11/3.12/3.13 interpreter, all dependencies resolve
# correctly — the uv.lock markers cover those versions.
requires-python = ">=3.11"
dependencies = [
    "web3>=6.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pytest>=7.0",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[dependency-groups]
dev = [
    "slither-analyzer>=0.11.5",
    "solc-select>=1.2.0",
    "z3-solver==4.12.6.0",
]
